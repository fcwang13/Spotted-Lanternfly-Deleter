<!DOCTYPE html>

<html>
    <style>
        body {
            border: 5px solid white;
            border-radius: 5px;
            padding: 10px;
            background-color: lightcoral;
            font-family: Courier, monospace;
        }
    </style>
<head>
    <link rel="stylesheet" href="style.css"/>
    <title>Log Lanternfly Death</title>
</head>
<body>
    <div class="title-row">
            <h1>Spotted Lanternfly Deleter</h1>
            <div class="buttons">
                <a href="home.html" class="button">Home</a>
                <a href="rewards.html" class="button">View Rewards</a>
                <a href="leaderboard.html" class="button">View Leaderboard</a>
            </div>
        </div>
    <h1>Log Lanternfly Death</h1>
    <p>
        Please enter the details of the spotted lanternfly you have killed.
    </p>
    <form>
        <label for="location">Location:</label>
        <input type="text" id="location" name="location"><br><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date"><br><br>
        <h2>Upload Image of Lanternfly</h2>
        <form>
            <input type="file" id="fileUpload" class="file-upload"
                name="fileUpload">
            <label for="fileUpload" class="custom-button">
                Choose File
            </label>
            <input type="submit" value="Upload">
        </form>
    </form>

    
</body>

<script>
    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const location = document.getElementById('location').value;
        const date = document.getElementById('date').value;
        console.log(`Location: ${location}, Date: ${date}`);
    });
</script>
</html>
